<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Boxes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="box box1"><span class="abc top-left">ABC</span></div>
    <div class="box box2"><span class="abc top-center">ABC</span></div>
    <div class="box box3"><span class="abc top-right">ABC</span></div>
  </div>

  <div class="container">
    <div class="box box4"><span class="abc middle-left">ABC</span></div>
    <div class="box box5"><span class="abc center">ABC</span></div>
    <div class="box box6"><span class="abc middle-right">ABC</span></div>
    <div class="box box6"><span class="abc center">ABC</span></div>
  </div>

  <div class="container">
    <div class="box box7"><span class="abc bottom-left">ABC</span></div>
    <div class="box box8"><span class="abc bottom-right">ABC</span></div>
  </div>

  <div class="container">
    <div class="box box9">
      <span class="abc top-left">ABC</span>
      <span class="abc top-center">ABC</span>
      <span class="abc top-right">ABC</span>
    </div>
  </div>

  <div class="container">
    <div class="box box10"><span class="abc bottom-left">ABC</span></div>
    <div class="box box11"><span class="abc bottom-center">ABC</span></div>
    <div class="box box12"><span class="abc bottom-center">ABC</span></div>
    <div class="box box13"><span class="abc bottom-center">ABC</span></div>
    <div class="box box14"><span class="abc bottom-right">ABC</span></div>
  </div>

</body>

</html>
