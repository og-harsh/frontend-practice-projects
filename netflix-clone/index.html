<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <nav>
            <span><img width="53" src="assets/images/logo.svg" alt=""></span>
            <div class="top-right">
                <div class="language-static">

                    <span>English</span>
                </div>
                <button class="signin-btn">Sign In</button>
            </div>

        </nav>
        <div class="box">

            <div class="hero">
                <span class="title">Unlimited movies, TV shows and more</span>
                <span class="subtitle">Starts at ₹149. Cancel at any time.</span>
                <span class="subtext">Ready to watch? Enter your email to create or restart your membership.</span>

                <div class="input-box">
                    <input type="email" placeholder="Email address" />
                    <button>Get Started &nbsp; &rarr;</button>
                </div>
            </div>


        </div>

    </div>

    <div class="separation"></div>
</body>

</html>
